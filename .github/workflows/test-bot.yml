name: Test bot classifier

# Runs the checklist reminder logic (no key needed), then the classifier
# against ~45 sample messages with the real API key.
# Manual only — each run costs a few cents. Read the log to see how each
# message was classified.
on:
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: bot
      - run: for f in src/*.js; do node --check "$f"; done
        working-directory: bot
      - run: node test/remind.mjs
        working-directory: bot
      - run: node test/classify.mjs
        working-directory: bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: node test/image.mjs
        working-directory: bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: node test/link.mjs
        working-directory: bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
